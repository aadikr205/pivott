<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tealIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0d9488" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Orbit Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#tealIndigo)" stroke-width="8" stroke-dasharray="16 12" opacity="0.3" />

  <!-- Dynamic Pivot Balance Arcs -->
  <g filter="url(#glow)">
    <!-- Main Pivot Loop / Ribbon -->
    <path d="M 160 360 C 160 270, 220 200, 290 190 C 350 180, 390 220, 390 280 C 390 340, 330 380, 260 380 C 200 380, 160 330, 160 260 C 160 180, 230 130, 320 130 C 370 130, 400 150, 420 170" 
          fill="none" 
          stroke="url(#tealIndigo)" 
          stroke-width="36" 
          stroke-linecap="round" />

    <!-- Pivot Fulcrum Needle -->
    <circle cx="256" cy="256" r="28" fill="#ffffff" />
    <circle cx="256" cy="256" r="16" fill="#0d9488" />

    <!-- Sparkle Nodes -->
    <circle cx="390" cy="280" r="12" fill="#38bdf8" />
    <circle cx="320" cy="130" r="10" fill="#2dd4bf" />
  </g>

  <!-- Tagline text "PIVOTT" -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="8" fill="#f8fafc" text-anchor="middle">PIVOTT</text>
</svg>
